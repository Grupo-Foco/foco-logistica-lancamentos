<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCO logística — Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#27401f; --verde-mid:#3c5a2f; --verde-light:#5f7d3e;
  --marrom:#6b5642; --marrom-dark:#41342a;
  --creme:#f3f2ea; --creme-dark:#e7e3d8; --branco:#fbfaf5;
  --cinza:#8a857a; --cinza-light:#d8d4c8; --texto:#22201a;
  --erro:#c0392b; --sucesso:#2f7d3f; --amber:#b07d12; --amber-bg:#fbf0d3;
  --shadow:0 4px 24px rgba(39,64,31,.10); --shadow-lg:0 12px 48px rgba(39,64,31,.18); --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--texto);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
header{background:var(--verde);padding:0 28px;display:flex;align-items:center;gap:22px;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.25);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#fff;display:flex;align-items:center;gap:10px;}
.logo img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;}
.logo .sep{color:rgba(255,255,255,.35);} .logo .pg{color:rgba(255,255,255,.7);font-weight:500;font-size:14px;}
.spacer{flex:1;} .hdr-right{display:flex;align-items:center;gap:12px;}
.sync{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--cinza);} .sync .dot.online{background:#7fd49a;} .sync .dot.err{background:#e88;}
.user-badge{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.8);}
.btn-h{font-size:12px;padding:7px 13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-family:'DM Mono',monospace;}
.btn-h:hover{background:rgba(255,255,255,.22);}
.wrap{max-width:1120px;margin:34px auto;padding:0 22px;}
.page-h h1{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;color:var(--verde);} .page-h{margin-bottom:22px;} .page-h p{color:var(--cinza);margin-top:5px;font-size:14px;}
.modes{display:flex;gap:4px;background:var(--branco);border-radius:12px;padding:5px;box-shadow:var(--shadow);width:fit-content;margin-bottom:20px;flex-wrap:wrap;}
.mode{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--cinza);}
.mode.active{background:var(--verde);color:#fff;}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;background:var(--branco);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;}
label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);}
input,select{padding:10px 12px;border:1.5px solid var(--cinza-light);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;background:#fff;width:100%;outline:none;}
input:focus,select:focus{border-color:var(--verde-light);}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;border:none;}
.btn-primary{background:var(--verde-light);color:#fff;} .btn-primary:hover{background:var(--verde-mid);}
.btn-ghost{background:transparent;color:var(--cinza);border:1.5px solid var(--cinza-light);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
.kpi .l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza);}
.kpi .v{font-family:'DM Sans',sans-serif;font-weight:700;font-size:23px;color:var(--verde);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.kpi.amber .v{color:var(--amber);} .kpi.green .v{color:var(--sucesso);} .kpi.red .v{color:var(--erro);}
.card{background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--creme-dark);}
.card-top h3{font-size:13px;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--verde);color:rgba(255,255,255,.85);font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;text-align:left;white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--creme-dark);font-size:13.5px;}
tbody tr:hover{background:var(--creme);}
tfoot td{padding:12px 14px;font-weight:700;border-top:2px solid var(--creme-dark);background:var(--creme);}
.mono{font-family:'DM Mono',monospace;} .right{text-align:right;} .center{text-align:center;}
.pos{color:var(--sucesso);font-weight:700;} .neg{color:var(--erro);font-weight:700;}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--creme-dark);color:var(--marrom-dark);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;}
.badge.apagar{background:var(--amber-bg);color:var(--amber);} .badge.pago{background:#dcecdf;color:var(--sucesso);}
.empty{text-align:center;padding:44px;color:var(--cinza);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--verde);color:#fff;padding:13px 18px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:600;z-index:300;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:none;} .toast.err{background:var(--erro);}
.loading{position:fixed;inset:0;background:rgba(39,64,31,.7);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;} .loading.hidden{display:none;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
.loading .t{font-family:'DM Mono',monospace;font-size:12px;color:#fff;}
@media(max-width:820px){header{padding:0 14px;gap:12px;overflow-x:auto;}.logo .pg{display:none;}.field{min-width:120px;}}
</style>
</head>

<script>
const SB_URL='https://kafucdhwbgpdwefkxlta.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZnVjZGh3YmdwZHdlZmt4bHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTE2NjgsImV4cCI6MjA5ODE2NzY2OH0.m8PZZf844Gn5xteopsA0s5nRlcS-HEKgzsVNMoWqLog';
const currentUser=sessionStorage.getItem('gf_user');
const currentNome=sessionStorage.getItem('gf_nome')||currentUser;
const currentRole=sessionStorage.getItem('gf_role')||'funcionario';
let currentPerms={}; try{currentPerms=JSON.parse(sessionStorage.getItem('gf_perms')||'{}');}catch(e){}
if(!currentUser) location.href='index.html';
function hasPerm(p){ return currentRole==='gestor'||currentPerms[p]===true; }
function sair(){ sessionStorage.clear(); location.href='index.html'; }
if(!hasPerm('exportar')){ alert('Sem acesso aos Relatórios.'); location.href='app.html'; }
const $=id=>document.getElementById(id);
$('userBadge').textContent=currentNome;
async function sb(path){ const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function sbAll(path){ const sep=path.includes('?')?'&':'?'; let all=[],offset=0; const batch=1000; for(let i=0;i<200;i++){ const rows=await sb(`${path}${sep}limit=${batch}&offset=${offset}`); all=all.concat(rows||[]); if(!rows||rows.length<batch) break; offset+=batch; } return all; }
function setSync(s){ const d=$('syncDot'),t=$('syncTxt'); d.className='dot '+(s==='online'?'online':s==='err'?'err':''); t.textContent=s==='online'?'online':s==='err'?'erro':'sincronizando…'; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fdate(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function toast(m,e){ const t=$('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); setTimeout(()=>t.className='toast',3000); }
function showLoading(b){ $('loading').classList.toggle('hidden',!b); }

let despesas=[], fretes=[], parcelas=[], mode='detalhado', exportData={head:[],rows:[],nome:'relatorio'};

async function carregar(){
  setSync('sync'); showLoading(true);
  try{
    const [de,fr,pa]=await Promise.all([
      sbAll('despesas?order=vencimento.asc'),
      sbAll('fretes?order=data_carregamento.asc').catch(()=>[]),
      sbAll('receita_parcelas').catch(()=>[]),
    ]);
    despesas=de||[]; fretes=fr||[]; parcelas=pa||[];
    const placas=[...new Set([...despesas.map(d=>d.placa),...fretes.map(f=>f.placa)].filter(Boolean))].sort();
    $('f-placa').innerHTML='<option value="">Todos</option>'+placas.map(p=>`<option>${esc(p)}</option>`).join('');
    const cats=[...new Set(despesas.map(d=>d.tipo_despesa).filter(Boolean))].sort();
    $('f-cat').innerHTML='<option value="">Todas</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
    setSync('online'); render();
  }catch(e){ console.error(e); setSync('err'); toast('Erro ao carregar dados.',true); }
  finally{ showLoading(false); }
}

function filtros(){ return {de:$('f-de').value, ate:$('f-ate').value, placa:$('f-placa').value, cat:$('f-cat').value}; }
function inPer(dtISO, de, ate){ if(!dtISO) return !de&&!ate?true:false; const x=String(dtISO).slice(0,10); return (!de||x>=de)&&(!ate||x<=ate); }
function despFiltradas(){
  const {de,ate,placa,cat}=filtros();
  return despesas.filter(d=>{
    if(!inPer(d.vencimento,de,ate)) return false;
    if(placa && d.placa!==placa) return false;
    if(cat && d.tipo_despesa!==cat) return false;
    return true;
  });
}

function setMode(m){
  mode=m;
  ['detalhado','categoria','caminhao','balanco'].forEach(x=>$('m-'+x).classList.toggle('active',x===m));
  $('cat-field').style.display = (m==='caminhao'||m==='balanco') ? 'none' : '';
  render();
}
function limparFiltros(){ $('f-de').value=''; $('f-ate').value=''; $('f-placa').value=''; $('f-cat').value=''; render(); }

function perLabel(){ const {de,ate}=filtros(); if(de&&ate) return `${fdate(de)} a ${fdate(ate)}`; if(de) return `desde ${fdate(de)}`; if(ate) return `até ${fdate(ate)}`; return 'todo o período'; }

function render(){
  if(mode==='detalhado') return renderDetalhado();
  if(mode==='categoria') return renderCategoria();
  if(mode==='caminhao') return renderCaminhao();
  if(mode==='balanco') return renderBalanco();
}

/* -------- Despesas detalhadas -------- */
function renderDetalhado(){
  const list=despFiltradas();
  const total=list.reduce((s,d)=>s+(+d.valor||0),0);
  const pago=list.filter(d=>d.status==='PAGO').reduce((s,d)=>s+(+d.valor||0),0);
  $('kpis').innerHTML=`
    <div class="kpi"><div class="l">Lançamentos</div><div class="v">${list.length}</div></div>
    <div class="kpi"><div class="l">Total</div><div class="v">${money(total)}</div></div>
    <div class="kpi green"><div class="l">Pago</div><div class="v">${money(pago)}</div></div>
    <div class="kpi amber"><div class="l">A pagar</div><div class="v">${money(total-pago)}</div></div>`;
  $('rep-titulo').textContent='Despesas detalhadas'; $('rep-sub').textContent=perLabel();
  $('rep-head').innerHTML=`<tr><th>Vencimento</th><th>Fornecedor</th><th>Categoria</th><th>Placa</th><th class="right">Valor</th><th class="right">Juros</th><th>Status</th><th>Conta</th></tr>`;
  $('rep-body').innerHTML=list.length? list.map(d=>`<tr>
    <td class="mono">${fdate(d.vencimento)}</td><td>${esc(d.fornecedor||'—')}</td>
    <td><span class="tag">${esc(d.tipo_despesa||'—')}</span></td><td class="mono">${esc(d.placa||'—')}</td>
    <td class="right mono">${money(d.valor)}</td><td class="right mono">${+d.juros>0?money(d.juros):'—'}</td>
    <td><span class="badge ${d.status==='PAGO'?'pago':'apagar'}">${d.status==='PAGO'?'PAGO':'A PAGAR'}</span></td>
    <td class="mono">${esc(d.conta||'—')}</td></tr>`).join('') : `<tr><td colspan="8"><div class="empty">Nenhuma despesa no filtro.</div></td></tr>`;
  $('rep-foot').innerHTML=`<tr><td colspan="4">TOTAL — ${list.length} lançamento(s)</td><td class="right mono">${money(total)}</td><td colspan="3"></td></tr>`;
  exportData={ nome:'despesas_detalhado',
    head:['Vencimento','Fornecedor','Documento','Categoria','Placa','Motorista','Valor','Juros','Status','Pagamento','Conta','Forma','Observação'],
    rows:list.map(d=>[fdate(d.vencimento),d.fornecedor,d.documento,d.tipo_despesa,d.placa,d.motorista,num(d.valor),num(d.juros),d.status,fdate(d.pagamento),d.conta,d.forma_pagamento,d.historico]) };
}

/* -------- Por categoria -------- */
function renderCategoria(){
  const list=despFiltradas(); const map={};
  list.forEach(d=>{ const k=d.tipo_despesa||'—'; (map[k]=map[k]||{n:0,v:0}); map[k].n++; map[k].v+=(+d.valor||0); });
  const rows=Object.entries(map).sort((a,b)=>b[1].v-a[1].v);
  const total=rows.reduce((s,r)=>s+r[1].v,0);
  $('kpis').innerHTML=`
    <div class="kpi"><div class="l">Categorias</div><div class="v">${rows.length}</div></div>
    <div class="kpi"><div class="l">Total</div><div class="v">${money(total)}</div></div>
    <div class="kpi"><div class="l">Lançamentos</div><div class="v">${list.length}</div></div>`;
  $('rep-titulo').textContent='Gasto por categoria'; $('rep-sub').textContent=perLabel()+(filtros().placa?` · ${filtros().placa}`:'');
  $('rep-head').innerHTML=`<tr><th>Categoria</th><th class="right">Lançamentos</th><th class="right">Total</th><th class="right">% do total</th></tr>`;
  $('rep-body').innerHTML=rows.length? rows.map(([k,o])=>`<tr>
    <td><span class="tag">${esc(k)}</span></td><td class="right mono">${o.n}</td>
    <td class="right mono">${money(o.v)}</td><td class="right mono">${total?(o.v/total*100).toFixed(1):'0'}%</td></tr>`).join('') : `<tr><td colspan="4"><div class="empty">Sem dados.</div></td></tr>`;
  $('rep-foot').innerHTML=`<tr><td>TOTAL</td><td class="right mono">${list.length}</td><td class="right mono">${money(total)}</td><td class="right mono">100%</td></tr>`;
  exportData={ nome:'por_categoria', head:['Categoria','Lançamentos','Total','% do total'],
    rows:rows.map(([k,o])=>[k,o.n,num(o.v), (total?(o.v/total*100).toFixed(1):'0')+'%']) };
}

/* -------- Por caminhão -------- */
function renderCaminhao(){
  const {de,ate}=filtros();
  const list=despesas.filter(d=>inPer(d.vencimento,de,ate) && (!filtros().placa||d.placa===filtros().placa));
  const map={};
  list.forEach(d=>{ const k=d.placa||'—'; (map[k]=map[k]||{n:0,v:0}); map[k].n++; map[k].v+=(+d.valor||0); });
  const rows=Object.entries(map).sort((a,b)=>b[1].v-a[1].v);
  const total=rows.reduce((s,r)=>s+r[1].v,0);
  $('kpis').innerHTML=`
    <div class="kpi"><div class="l">Caminhões</div><div class="v">${rows.length}</div></div>
    <div class="kpi"><div class="l">Total despesas</div><div class="v">${money(total)}</div></div>
    <div class="kpi"><div class="l">Lançamentos</div><div class="v">${list.length}</div></div>`;
  $('rep-titulo').textContent='Gasto por caminhão'; $('rep-sub').textContent=perLabel();
  $('rep-head').innerHTML=`<tr><th>Placa</th><th class="right">Lançamentos</th><th class="right">Total gasto</th><th class="right">% do total</th></tr>`;
  $('rep-body').innerHTML=rows.length? rows.map(([k,o])=>`<tr>
    <td class="mono">${esc(k)}</td><td class="right mono">${o.n}</td>
    <td class="right mono">${money(o.v)}</td><td class="right mono">${total?(o.v/total*100).toFixed(1):'0'}%</td></tr>`).join('') : `<tr><td colspan="4"><div class="empty">Sem dados.</div></td></tr>`;
  $('rep-foot').innerHTML=`<tr><td>TOTAL</td><td class="right mono">${list.length}</td><td class="right mono">${money(total)}</td><td class="right mono">100%</td></tr>`;
  exportData={ nome:'por_caminhao', head:['Placa','Lançamentos','Total gasto','% do total'],
    rows:rows.map(([k,o])=>[k,o.n,num(o.v),(total?(o.v/total*100).toFixed(1):'0')+'%']) };
}

/* -------- Balanço (despesa × receita) por caminhão -------- */
function renderBalanco(){
  const {de,ate,placa}=filtros();
  const placas=[...new Set([...despesas.map(d=>d.placa),...fretes.map(f=>f.placa)].filter(Boolean))].filter(p=>!placa||p===placa).sort();
  const rows=placas.map(p=>{
    const desp=despesas.filter(d=>d.placa===p && inPer(d.vencimento,de,ate)).reduce((s,d)=>s+(+d.valor||0),0);
    const frs=fretes.filter(f=>f.placa===p && inPer(f.data_carregamento||f.created_at,de,ate));
    const rec=frs.reduce((s,f)=>s+(+f.valor_total||0),0);
    return {p, rec, desp, res:rec-desp, nf:frs.length};
  }).filter(r=>r.rec!==0 || r.desp!==0);
  rows.sort((a,b)=>b.res-a.res);
  const tRec=rows.reduce((s,r)=>s+r.rec,0), tDesp=rows.reduce((s,r)=>s+r.desp,0), tRes=tRec-tDesp;
  $('kpis').innerHTML=`
    <div class="kpi green"><div class="l">Receitas (fretes)</div><div class="v">${money(tRec)}</div></div>
    <div class="kpi amber"><div class="l">Despesas</div><div class="v">${money(tDesp)}</div></div>
    <div class="kpi ${tRes>=0?'green':'red'}"><div class="l">Resultado</div><div class="v">${money(tRes)}</div></div>`;
  $('rep-titulo').textContent='Balanço por caminhão (despesa × receita)'; $('rep-sub').textContent=perLabel();
  $('rep-head').innerHTML=`<tr><th>Placa</th><th class="right">Fretes</th><th class="right">Receita</th><th class="right">Despesa</th><th class="right">Resultado</th></tr>`;
  $('rep-body').innerHTML=rows.length? rows.map(r=>`<tr>
    <td class="mono">${esc(r.p)}</td><td class="right mono">${r.nf}</td>
    <td class="right mono">${money(r.rec)}</td><td class="right mono">${money(r.desp)}</td>
    <td class="right mono ${r.res>=0?'pos':'neg'}">${money(r.res)} ${r.res>=0?'▲':'▼'}</td></tr>`).join('') : `<tr><td colspan="5"><div class="empty">Sem dados no período. (As receitas vêm dos fretes cadastrados em Receitas.)</div></td></tr>`;
  $('rep-foot').innerHTML=`<tr><td>TOTAL</td><td></td><td class="right mono">${money(tRec)}</td><td class="right mono">${money(tDesp)}</td><td class="right mono ${tRes>=0?'pos':'neg'}">${money(tRes)}</td></tr>`;
  exportData={ nome:'balanco_caminhao', head:['Placa','Fretes','Receita','Despesa','Resultado'],
    rows:rows.map(r=>[r.p,r.nf,num(r.rec),num(r.desp),num(r.res)]) };
}

/* -------- Exportar CSV -------- */
function num(v){ return (Number(v)||0).toFixed(2).replace('.',','); }
function csvCell(v){ const s=(v==null?'':String(v)).replace(/"/g,'""'); return /[";\n]/.test(s)?`"${s}"`:s; }
function exportar(){
  if(!exportData.rows.length){ toast('Nada para exportar.',true); return; }
  const linhas=[exportData.head.join(';'), ...exportData.rows.map(r=>r.map(csvCell).join(';'))];
  const csv='\uFEFF'+linhas.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`${exportData.nome}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Planilha exportada.');
}

carregar();
</script>
