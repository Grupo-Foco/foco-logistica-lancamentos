<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCO logística — Endividamento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#27401f; --verde-mid:#3c5a2f; --verde-light:#5f7d3e;
  --marrom:#6b5642; --marrom-dark:#41342a;
  --creme:#f3f2ea; --creme-dark:#e7e3d8; --branco:#fbfaf5;
  --cinza:#8a857a; --cinza-light:#d8d4c8; --texto:#22201a;
  --erro:#c0392b; --sucesso:#2f7d3f; --amber:#b07d12; --amber-bg:#fbf0d3;
  --shadow:0 4px 24px rgba(39,64,31,.10); --shadow-lg:0 12px 48px rgba(39,64,31,.18);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--texto);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
header{background:var(--verde);padding:0 28px;display:flex;align-items:center;gap:22px;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.25);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#fff;display:flex;align-items:center;gap:10px;}
.logo img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;}
.logo .sep{color:rgba(255,255,255,.35);} .logo .pg{color:rgba(255,255,255,.7);font-weight:500;font-size:14px;}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:7px;border:none;color:rgba(255,255,255,.65);background:transparent;}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.08);} .nav-tab.active{background:var(--verde-light);color:#fff;font-weight:700;}
.spacer{flex:1;} .hdr-right{display:flex;align-items:center;gap:12px;}
.sync{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--cinza);} .sync .dot.online{background:#7fd49a;} .sync .dot.err{background:#e88;}
.user-badge{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.8);}
.btn-h{font-size:12px;padding:7px 13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-family:'DM Mono',monospace;}
.btn-h:hover{background:rgba(255,255,255,.22);}
.view{display:none;} .view.active{display:block;}
.wrap{max-width:1040px;margin:36px auto;padding:0 22px;}
.page-h h1{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;color:var(--verde);} .page-h{margin-bottom:26px;} .page-h p{color:var(--cinza);margin-top:5px;font-size:14px;}
.req{color:var(--marrom);}
.card{background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.section{padding:24px 28px;border-bottom:1px solid var(--creme-dark);} .section:last-child{border-bottom:none;}
.sec-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-light);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--creme-dark);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;} .grid.two{grid-template-columns:repeat(2,1fr);} .grid.four{grid-template-columns:repeat(4,1fr);}
.field{display:flex;flex-direction:column;gap:6px;}
label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);}
input,select,textarea{padding:11px 13px;border:1.5px solid var(--cinza-light);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--texto);background:#fff;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--verde-light);} textarea{resize:vertical;min-height:60px;}
.actions{padding:22px 28px;display:flex;justify-content:flex-end;gap:12px;background:var(--creme);}
.btn{padding:11px 22px;border-radius:10px;font-size:14px;font-weight:700;border:none;}
.btn-primary{background:var(--verde-light);color:#fff;} .btn-primary:hover{background:var(--verde-mid);}
.btn-ghost{background:transparent;color:var(--cinza);border:1.5px solid var(--cinza-light);} .btn-ghost:hover{background:var(--creme-dark);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;} .btn-danger{background:var(--erro);color:#fff;} .btn-marrom{background:var(--marrom);color:#fff;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 18px;}
.kpi .l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza);}
.kpi .v{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--verde);margin-top:4px;}
.kpi.amber .v{color:var(--amber);} .kpi.green .v{color:var(--sucesso);}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;} .toolbar .field{flex:1;min-width:140px;}
.div{background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.div-top{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--creme-dark);flex-wrap:wrap;}
.div-cod{font-family:'DM Mono',monospace;font-weight:600;color:var(--marrom-dark);background:var(--creme);padding:3px 10px;border-radius:6px;font-size:12px;}
.div-desc{font-weight:700;font-size:16px;} .div-sub{font-size:13px;color:var(--cinza);}
.div-val{margin-left:auto;text-align:right;} .div-val .vt{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--verde);} .div-val .vs{font-size:11px;color:var(--cinza);font-family:'DM Mono',monospace;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;}
.badge.ativo{background:var(--amber-bg);color:var(--amber);} .badge.quitado{background:#dcecdf;color:var(--sucesso);}
.div-body{padding:8px 20px 16px;}
.ptable{width:100%;border-collapse:collapse;} .ptable th{text-align:left;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);padding:8px 6px;}
.ptable td{padding:8px 6px;border-top:1px solid var(--creme-dark);font-size:13.5px;}
.pmoney{font-family:'DM Mono',monospace;text-align:right;} .pst{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;} .pst.ap{color:var(--amber);} .pst.pg{color:var(--sucesso);}
.div-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px solid var(--creme-dark);}
.empty{text-align:center;padding:48px;color:var(--cinza);background:var(--branco);border-radius:var(--radius);box-shadow:var(--shadow);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--verde);color:#fff;padding:13px 18px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:600;z-index:300;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:none;} .toast.err{background:var(--erro);}
.loading{position:fixed;inset:0;background:rgba(39,64,31,.7);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;} .loading.hidden{display:none;}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
.loading .t{font-family:'DM Mono',monospace;font-size:12px;color:#fff;}
@media(max-width:820px){header{padding:0 14px;gap:12px;overflow-x:auto;}.logo .pg{display:none;}.grid,.grid.two,.grid.four{grid-template-columns:1fr;}}
</style>
</head>

<div class="view active" id="view-novo">
  <div class="wrap">

    <div class="card">
      <div class="section">
        <div class="sec-label">01 — Dívida</div>
        <div class="grid">
          <div class="field"><label>Descrição <span class="req">★</span></label><input id="f_desc" placeholder="Ex: Financiamento Scania"></div>
          <div class="field"><label>Credor</label><input id="f_credor" placeholder="Banco / financeira"></div>
          <div class="field"><label>Placa (se for veículo)</label><input id="f_placa" list="placas-list" style="text-transform:uppercase"><datalist id="placas-list"></datalist></div>
        </div>
      </div>
      <div class="section">
        <div class="sec-label">02 — Valores</div>
        <div class="grid four">
          <div class="field"><label>Valor total (R$) <span class="req">★</span></label><input type="number" step="0.01" min="0" id="f_total" placeholder="0,00"></div>

<script>
/* ===================== CONFIG ===================== */
const SB_URL='https://kafucdhwbgpdwefkxlta.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZnVjZGh3YmdwZHdlZmt4bHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTE2NjgsImV4cCI6MjA5ODE2NzY2OH0.m8PZZf844Gn5xteopsA0s5nRlcS-HEKgzsVNMoWqLog';

const currentUser=sessionStorage.getItem('gf_user');
const currentNome=sessionStorage.getItem('gf_nome')||currentUser;
const currentRole=sessionStorage.getItem('gf_role')||'funcionario';
let currentPerms={}; try{currentPerms=JSON.parse(sessionStorage.getItem('gf_perms')||'{}');}catch(e){}
if(!currentUser) location.href='index.html';
function hasPerm(p){ return currentRole==='gestor'||currentPerms[p]===true; }
function sair(){ sessionStorage.clear(); location.href='index.html'; }
if(!hasPerm('endividamento')){ alert('Sem acesso à área de Endividamento.'); location.href='app.html'; }
(function(){ document.getElementById('userBadge').textContent=currentNome;
  if(!(currentRole!=='gestor'&&currentPerms.receitas_bloqueado===true)) document.getElementById('btn-receitas').style.display='';
  if(hasPerm('configuracoes')) document.getElementById('btn-config').style.display=''; })();

async function sb(path,opts={}){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opts,headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  const t=await r.text(); return t?JSON.parse(t):[];
}
function setSync(s){ const d=$('syncDot'),t=$('syncTxt'); d.className='dot '+(s==='online'?'online':s==='err'?'err':''); t.textContent=s==='online'?'online':s==='err'?'erro de conexão':'sincronizando…'; }
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fdate(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function toast(m,e){ const t=$('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); setTimeout(()=>t.className='toast',3200); }
function showLoading(b){ $('loading').classList.toggle('hidden',!b); }
function publicUrl(p){ return p?`${SB_URL}/storage/v1/object/public/comprovantes/${p}`:null; }
async function uploadAnexo(file,pasta){ if(!file) return null; const ext=(file.name.split('.').pop()||'dat').toLowerCase(); const path=`${pasta}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`; const r=await fetch(`${SB_URL}/storage/v1/object/comprovantes/${path}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'x-upsert':'true'},body:file}); if(!r.ok) throw new Error('Falha no upload: '+await r.text()); return path; }
function anexoSel(input){ pendingAnexo=input.files[0]||null; $('anexo-info').textContent=pendingAnexo?'📎 '+pendingAnexo.name:''; }

let dividasBD=[], parcelasBD=[], caminhoesBD=[], editing=null, pendingAnexo=null, baixaId=null;

async function carregar(){
  setSync('sync'); showLoading(true);
  try{
    const [dv,pa,ca]=await Promise.all([
      sb('endividamento?order=created_at.desc&limit=2000'),
      sb('endividamento_parcelas?order=vencimento.asc&limit=20000').catch(()=>[]),
      sb('caminhoes?order=placa.asc&limit=2000').catch(()=>[]),
    ]);
    dividasBD=dv||[]; parcelasBD=pa||[]; caminhoesBD=ca||[];
    $('placas-list').innerHTML=caminhoesBD.map(c=>`<option value="${esc(c.placa)}">`).join('');
    const placas=[...new Set(dividasBD.map(d=>d.placa).filter(Boolean))].sort();
    $('flt-placa').innerHTML='<option value="">Todas</option>'+placas.map(p=>`<option>${esc(p)}</option>`).join('');
    renderLista(); setSync('online');
  }catch(e){ console.error(e); setSync('err'); toast('Erro ao carregar.',true); }
  finally{ showLoading(false); }
}
function parcelasDe(id){ return parcelasBD.filter(p=>p.divida_id===id); }

async function salvar(){
  const desc=$('f_desc').value.trim(), total=parseFloat($('f_total').value)||0;
  const n=Math.max(1,Math.min(120,parseInt($('f_parcelas').value)||1)), inicio=$('f_inicio').value;
  if(!desc){ toast('Informe a descrição.',true); return; }
  if(total<=0){ toast('Informe o valor total.',true); return; }
  if(!inicio){ toast('Informe o 1º vencimento.',true); return; }
  const header={ descricao:desc, credor:$('f_credor').value.trim()||null, placa:$('f_placa').value.trim().toUpperCase()||null,
    valor_total:total, qtd_parcelas:n, taxa_juros:parseFloat($('f_taxa').value)||null, data_inicio:inicio,
    observacao:$('f_obs').value.trim()||null, lancador:currentNome };
  const btn=$('btnSalvar'); btn.disabled=true; btn.textContent='Salvando…'; setSync('sync');
  try{
    let anexoPath = editing ? ((dividasBD.find(x=>x.id===editing)||{}).anexo||null) : null;
    if(pendingAnexo) anexoPath=await uploadAnexo(pendingAnexo,'dividas');
    header.anexo=anexoPath;
    let id;
    if(editing){
      await sb(`endividamento?id=eq.${editing}`,{method:'PATCH',body:JSON.stringify(header)});
      await sb(`endividamento_parcelas?divida_id=eq.${editing}`,{method:'DELETE'});
      id=editing;
    }else{
      header.status='ATIVO';
      const r=await sb('endividamento',{method:'POST',body:JSON.stringify(header)}); id=r[0].id;
    }
    const parc=parseFloat((total/n).toFixed(2)); const base0=new Date(inicio+'T00:00'); const rows=[];
    for(let i=0;i<n;i++){ const dt=new Date(base0); dt.setMonth(dt.getMonth()+i);
      const v=i===n-1? parseFloat((total-parc*(n-1)).toFixed(2)) : parc;
      rows.push({divida_id:id,numero:i+1,valor:v,vencimento:dt.toISOString().slice(0,10),status:'A_PAGAR'}); }
    await sb('endividamento_parcelas',{method:'POST',body:JSON.stringify(rows)});
    toast(editing?'Dívida atualizada.':'Dívida cadastrada.'); setSync('online'); limparForm(); await carregar(); showView('painel');
  }catch(e){ console.error(e); setSync('err'); toast('Erro: '+e.message,true); }
  finally{ btn.disabled=false; btn.textContent=editing?'✓ Atualizar dívida':'✓ Salvar dívida'; }
}

function filtrar(){
  const q=($('flt-busca').value||'').toLowerCase(), st=$('flt-status').value, pl=$('flt-placa').value, de=$('flt-de').value, ate=$('flt-ate').value;
  return dividasBD.filter(d=>{
    if(st && d.status!==st) return false;
    if(pl && d.placa!==pl) return false;
    if(q){ const hay=`${d.descricao||''} ${d.credor||''} ${d.placa||''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    if(de||ate){ const ds=parcelasDe(d.id).map(p=>String(p.vencimento||'').slice(0,10)); if(!ds.some(x=>(!de||x>=de)&&(!ate||x<=ate))) return false; }
    return true;
  });
}
function renderLista(){
  const list=filtrar();
  const ids=new Set(list.map(d=>d.id)); const ps=parcelasBD.filter(p=>ids.has(p.divida_id));
  const saldo=ps.filter(p=>p.status==='A_PAGAR').reduce((s,p)=>s+(+p.valor||0),0);
  const pago=ps.filter(p=>p.status==='PAGO').reduce((s,p)=>s+(+p.valor||0),0);
  const total=list.reduce((s,d)=>s+(+d.valor_total||0),0);
  $('kpis').innerHTML=`
    <div class="kpi"><div class="l">Dívidas</div><div class="v">${list.length}</div></div>
    <div class="kpi"><div class="l">Valor contratado</div><div class="v">${money(total)}</div></div>
    <div class="kpi amber"><div class="l">Saldo devedor</div><div class="v">${money(saldo)}</div></div>
    <div class="kpi green"><div class="l">Já pago</div><div class="v">${money(pago)}</div></div>`;
  $('painel-sub').textContent=`${list.length} dívida(s)`;
  const box=$('dividas-box'); const canDel=hasPerm('excluir');
  if(!list.length){ box.innerHTML=`<div class="empty">Nenhuma dívida encontrada.</div>`; return; }
  box.innerHTML=list.map(d=>{
    const ps=parcelasDe(d.id); const pagas=ps.filter(p=>p.status==='PAGO').length;
    const pago=ps.filter(p=>p.status==='PAGO').reduce((s,p)=>s+(+p.valor||0),0);
    const stCls=d.status==='QUITADO'?'quitado':'ativo'; const stLbl=d.status==='QUITADO'?'QUITADO':'ATIVO';
    const rows=ps.map(p=>`<tr>
      <td class="mono">${p.numero}/${ps.length}</td>
      <td>${fdate(p.vencimento)}</td>
      <td class="pmoney">${money(p.valor)}</td>
      <td><span class="pst ${p.status==='PAGO'?'pg':'ap'}">${p.status==='PAGO'?'PAGO '+(p.pagamento?fdate(p.pagamento):''):'A PAGAR'}</span></td>
      <td style="text-align:right">${p.status==='A_PAGAR'
          ? `<button class="btn btn-sm btn-primary" onclick="abrirBaixa(${p.id})">Baixar</button>`
          : `${p.comprovante?`<a href="${publicUrl(p.comprovante)}" target="_blank" class="mono" style="color:var(--verde-light);font-size:11px;text-decoration:none;margin-right:8px">📎</a>`:''}<button class="btn btn-sm btn-ghost" onclick="estornar(${p.id})">Estornar</button>`}</td>
    </tr>`).join('');
    return `<div class="div">
      <div class="div-top">
        <span class="div-cod">#${d.id}</span>
        <div><div class="div-desc">${esc(d.descricao||'—')}</div>
          <div class="div-sub">${d.credor?esc(d.credor):''}${d.placa?' · '+esc(d.placa):''}${d.taxa_juros?' · '+d.taxa_juros+'% a.m.':''} · ${pagas}/${ps.length} pagas</div></div>
        <span class="badge ${stCls}">${stLbl}</span>
        <div class="div-val"><div class="vt">${money(d.valor_total)}</div><div class="vs">pago ${money(pago)}</div></div>
      </div>
      <div class="div-body">
        <table class="ptable"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
        <div class="div-actions">
          ${d.anexo?`<a href="${publicUrl(d.anexo)}" target="_blank" class="btn btn-sm btn-ghost" style="text-decoration:none">📎 Contrato</a>`:''}
          <button class="btn btn-sm btn-ghost" onclick="editar(${d.id})">Editar</button>
          ${d.status!=='QUITADO'?`<button class="btn btn-sm btn-marrom" onclick="setStatus(${d.id},'QUITADO')">Marcar quitada</button>`:`<button class="btn btn-sm btn-ghost" onclick="setStatus(${d.id},'ATIVO')">Reabrir</button>`}
          ${canDel?`<button class="btn btn-sm btn-danger" onclick="excluir(${d.id})">Excluir</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function abrirBaixa(id){ baixaId=id; $('bx-data').value=new Date().toISOString().slice(0,10); $('bx-anexo').value=''; $('bxOverlay').style.display='flex'; }
function fecharBaixa(){ $('bxOverlay').style.display='none'; baixaId=null; }
async function confirmarBaixa(){
  const data=$('bx-data').value; if(!data){ toast('Informe a data.',true); return; }
  const file=$('bx-anexo').files[0]||null; const btn=$('bx-btn'); btn.disabled=true; btn.textContent='Salvando…'; setSync('sync');
  try{
    let comp=null; if(file) comp=await uploadAnexo(file,'dividas-pgto');
    const patch={status:'PAGO',pagamento:data}; if(comp) patch.comprovante=comp;
    await sb(`endividamento_parcelas?id=eq.${baixaId}`,{method:'PATCH',body:JSON.stringify(patch)});
    toast('Parcela baixada.'); setSync('online'); fecharBaixa(); await carregar();
  }catch(e){ setSync('err'); toast('Erro: '+e.message,true); }
  finally{ btn.disabled=false; btn.textContent='Confirmar'; }
}
async function estornar(id){ if(!confirm('Estornar este pagamento?')) return; setSync('sync');
  try{ await sb(`endividamento_parcelas?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'A_PAGAR',pagamento:null,comprovante:null})}); toast('Estornado.'); setSync('online'); await carregar(); }catch(e){ setSync('err'); toast('Erro.',true); } }
async function setStatus(id,st){ setSync('sync'); try{ await sb(`endividamento?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:st})}); toast('Atualizado.'); setSync('online'); await carregar(); }catch(e){ setSync('err'); toast('Erro.',true); } }
async function excluir(id){ if(!hasPerm('excluir')){ toast('Sem permissão.',true); return; } if(!confirm('Excluir esta dívida e suas parcelas?')) return; setSync('sync');
  try{ await sb(`endividamento?id=eq.${id}`,{method:'DELETE'}); toast('Excluída.'); setSync('online'); await carregar(); }catch(e){ setSync('err'); toast('Erro.',true); } }

function editar(id){
  const d=dividasBD.find(x=>x.id===id); if(!d) return; editing=id;
  $('form-title').textContent='Editar dívida #'+id;
  $('f_desc').value=d.descricao||''; $('f_credor').value=d.credor||''; $('f_placa').value=d.placa||'';
  $('f_total').value=d.valor_total||''; $('f_parcelas').value=d.qtd_parcelas||1; $('f_taxa').value=d.taxa_juros||''; $('f_inicio').value=d.data_inicio||'';
  $('f_obs').value=d.observacao||''; pendingAnexo=null; $('f_anexo').value=''; $('anexo-info').textContent=d.anexo?'📎 anexo atual — envie outro para substituir':'';
  $('btnSalvar').textContent='✓ Atualizar dívida'; showView('novo'); window.scrollTo({top:0});
  toast('Atenção: salvar recria as parcelas desta dívida.');
}
function limparForm(){
  editing=null; $('form-title').textContent='Nova dívida';
  ['f_desc','f_credor','f_placa','f_total','f_taxa','f_inicio','f_obs'].forEach(id=>$(id).value=''); $('f_parcelas').value=12;
  pendingAnexo=null; if($('f_anexo'))$('f_anexo').value=''; if($('anexo-info'))$('anexo-info').textContent='';
  $('btnSalvar').textContent='✓ Salvar dívida';
}
function showView(v){ document.querySelectorAll('.view').forEach(el=>el.classList.remove('active')); $('view-'+v).classList.add('active'); $('tab-novo').classList.toggle('active',v==='novo'); $('tab-painel').classList.toggle('active',v==='painel'); }

carregar();
</script>
