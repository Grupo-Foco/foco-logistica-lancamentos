<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCO logística — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#27401f; --verde-mid:#3c5a2f; --verde-light:#5f7d3e;
  --marrom:#5e4a39; --marrom-dark:#41342a;
  --creme:#f3f2ea; --branco:#fdfcf8;
  --texto:#23201b; --cinza:#8a8378; --cinza-light:#e6e3da;
  --vermelho:#c0392b;
  --radius:14px; --shadow:0 12px 40px rgba(39,64,31,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Syne',sans-serif;color:var(--texto);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  background:
    radial-gradient(820px 480px at 12% -10%, rgba(95,125,62,.30), transparent 60%),
    radial-gradient(760px 480px at 112% 112%, rgba(94,74,57,.32), transparent 55%),
    linear-gradient(160deg,#2c3a23,#1d2417);
}
.card{
  width:100%;max-width:380px;background:var(--branco);border-radius:20px;
  padding:36px 30px 28px;box-shadow:var(--shadow);text-align:center;
}
.logo{width:78px;height:78px;border-radius:18px;margin:0 auto 16px;overflow:hidden;
  background:#fff;box-shadow:0 6px 22px rgba(39,64,31,.18);display:grid;place-items:center;}
.logo img{width:100%;height:100%;object-fit:contain;}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--verde);}
.sub{font-size:12px;color:var(--cinza);font-family:'DM Mono',monospace;letter-spacing:.04em;margin:5px 0 24px;}
form{text-align:left;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-family:'DM Mono',monospace;}
input{padding:11px 14px;border:1.5px solid var(--cinza-light);border-radius:10px;font-size:15px;font-family:'Syne',sans-serif;color:var(--texto);background:#fff;outline:none;transition:border .15s;}
input:focus{border-color:var(--verde-light);}
.btn{margin-top:4px;padding:12px;border:none;border-radius:11px;background:var(--verde-light);color:#fff;font-size:15px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:background .15s;letter-spacing:.02em;}
.btn:hover{background:var(--verde-mid);}
.btn:disabled{opacity:.6;cursor:wait;}
.err{display:none;background:rgba(192,57,43,.1);color:var(--vermelho);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;}
.err.show{display:block;}
.foot{color:rgba(255,255,255,.55);font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.04em;}
.cfgwarn{display:none;background:#fff4e0;color:#8a5b00;border:1px solid #f0d28a;border-radius:9px;padding:10px 12px;font-size:12.5px;font-family:'DM Mono',monospace;margin-bottom:6px;line-height:1.5;}
.cfgwarn.show{display:block;}
</style>
</head>

if(!_configurado) document.getElementById('cfgwarn').classList.add('show');

async function sb(path, opts={}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{ 'apikey':SB_KEY, 'Authorization':`Bearer ${SB_KEY}`,
      'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  const t = await r.text(); return t ? JSON.parse(t) : [];
}

function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.classList.add('show'); }

// se já estiver logado, vai direto pro sistema
if(sessionStorage.getItem('gf_user')) window.location.href = 'app.html';

document.getElementById('loginForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  document.getElementById('err').classList.remove('show');
  if(!_configurado){ showErr('Sistema ainda não configurado (Supabase).'); return; }

  const login = document.getElementById('user').value.trim().toLowerCase();
  const senha = document.getElementById('pass').value;
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Entrando…';

  try{
    const rows = await sb(`usuarios?login=eq.${encodeURIComponent(login)}&select=*`);
    const u = rows[0];
    if(!u || u.senha !== senha || u.ativo === false){
      showErr('Usuário ou senha inválidos.');
    } else {
      sessionStorage.setItem('gf_user',  u.login);
      sessionStorage.setItem('gf_nome',  u.nome || u.login);
      sessionStorage.setItem('gf_role',  u.role || 'funcionario');
      sessionStorage.setItem('gf_perms', JSON.stringify(u.perms || {}));
      window.location.href = 'app.html';
    }
  }catch(e){
    showErr('Erro ao conectar. Verifique a configuração do Supabase.');
    console.error(e);
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
