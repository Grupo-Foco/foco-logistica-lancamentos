<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOCO logística — Posicionamento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#27401f; --verde-mid:#3c5a2f; --verde-light:#5f7d3e;
  --marrom:#6b5642; --marrom-dark:#41342a;
  --creme:#f3f2ea; --creme-dark:#e7e3d8; --branco:#fbfaf5;
  --cinza:#8a857a; --cinza-light:#d8d4c8; --texto:#22201a;
  --erro:#c0392b; --sucesso:#2f7d3f; --amber:#b07d12; --amber-bg:#fbf0d3;
  --shadow:0 4px 24px rgba(39,64,31,.10); --shadow-lg:0 12px 48px rgba(39,64,31,.18);
  --radius:12px; --radius-sm:7px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--texto);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
header{background:var(--verde);padding:0 28px;display:flex;align-items:center;gap:22px;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.25);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:10px;}
.logo img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;}
.logo .sep{color:rgba(255,255,255,.35);font-weight:400;}
.logo .pg{font-weight:600;font-size:14px;color:rgba(255,255,255,.8);}
.nav-tabs{display:flex;gap:4px;}
.nav-tab{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:7px;border:none;color:rgba(255,255,255,.65);background:transparent;}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.08);} .nav-tab.active{background:var(--verde-light);color:#fff;font-weight:700;}
.nav-tab.brown{color:rgba(255,255,255,.7);}
.spacer{flex:1;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.btn-h{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);background:transparent;}
.btn-h:hover{background:rgba(255,255,255,.1);color:#fff;}
.sync{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#caa84a;}
.sync .dot.online{background:#7bbf74;} .sync .dot.err{background:#d9704f;}
.user-badge{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1);padding:5px 11px;border-radius:999px;}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px;}
.page-h{margin-bottom:18px;}
.page-h h1{font-family:'Syne',sans-serif;font-weight:800;font-size:27px;color:var(--verde);}
.page-h p{color:var(--cinza);font-size:13px;margin-top:3px;}
.toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--branco);border:1px solid var(--creme-dark);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:22px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);}
input[type=date],input[type=text]{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--texto);background:var(--branco);border:1px solid var(--cinza-light);border-radius:var(--radius-sm);padding:9px 11px;outline:none;}
input:focus{border-color:var(--verde-light);box-shadow:0 0 0 3px rgba(95,125,62,.12);}
.btn{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.04em;border-radius:var(--radius-sm);padding:10px 16px;border:1.5px solid var(--verde);background:var(--verde);color:#fff;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.btn:hover{background:#1c2f16;}
.btn.ghost{background:var(--branco);color:var(--verde);} .btn.ghost:hover{background:var(--creme);}
.btn.amber{background:var(--amber);border-color:var(--amber);} .btn.amber:hover{filter:brightness(.95);}
.tb-sp{flex:1;}
.grupo-sec{margin-bottom:24px;}
.grupo-tit{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--verde);background:var(--creme-dark);border-radius:8px;padding:8px 14px;display:inline-block;margin-bottom:12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.tcard{background:var(--branco);border:1px solid var(--creme-dark);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;}
.tcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.tcard-placa{font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:var(--verde);letter-spacing:.03em;}
.tcard-grp select{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza);border:1px solid var(--cinza-light);border-radius:6px;padding:3px 6px;background:var(--creme);}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.tgrid .full{grid-column:1 / -1;}
.tf{display:flex;flex-direction:column;gap:3px;}
.tf label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--cinza);}
.tf input{padding:7px 9px;font-size:13px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--verde);color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);transition:transform .3s;z-index:300;}
.toast.show{transform:translateX(-50%) translateY(0);} .toast.err{background:var(--erro);}
.hidden{display:none!important;}
#loading{position:fixed;inset:0;background:rgba(243,242,234,.7);display:flex;align-items:center;justify-content:center;z-index:200;}
#loading .sp{width:40px;height:40px;border:4px solid var(--creme-dark);border-top-color:var(--verde);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:640px){ .tgrid{grid-template-columns:1fr;} header{padding:0 14px;gap:12px;} .wrap{padding:18px 14px 70px;} }
</style>

<script>
const SB_URL = 'https://kafucdhwbgpdwefkxlta.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZnVjZGh3YmdwZHdlZmt4bHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTE2NjgsImV4cCI6MjA5ODE2NzY2OH0.m8PZZf844Gn5xteopsA0s5nRlcS-HEKgzsVNMoWqLog';

const currentUser = sessionStorage.getItem('gf_user');
const currentNome = sessionStorage.getItem('gf_nome') || currentUser;
const currentRole = sessionStorage.getItem('gf_role') || 'funcionario';
let currentPerms = {};
try{ currentPerms = JSON.parse(sessionStorage.getItem('gf_perms')||'{}'); }catch(e){}
if(!currentUser) location.href='index.html';
function hasPerm(p){ return currentRole==='gestor' || currentPerms[p]===true; }
function sair(){ sessionStorage.clear(); location.href='index.html'; }

async function sb(path, opts={}){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{cache:'no-store',...opts,headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  const t=await r.text(); return t?JSON.parse(t):[];
}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setSync(s){ const d=$('syncDot'),t=$('syncTxt'); d.className='dot '+(s==='online'?'online':s==='err'?'err':''); t.textContent=s==='online'?'online':s==='err'?'erro de conexão':'sincronizando…'; }
function toast(m,e){ const t=$('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); setTimeout(()=>t.className='toast',3400); }
function showLoading(b){ $('loading').classList.toggle('hidden',!b); }
function hojeISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fdateBR(iso){ const p=String(iso||'').slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }

/* ===================== FROTA FIXA (14) ===================== */
/* grupo e motorista padrão — o grupo pode ser trocado por caminhão na tela */
const GRUPOS = ['RODOTREM','4 EIXO','RODOCAÇAMBA','FAZENDAS'];
const FROTA = [
  {placa:'FRI-0D72', grupo:'RODOTREM',    motorista:'João Pedro'},
  {placa:'PRJ-3G87', grupo:'RODOTREM',    motorista:'Moacir'},
  {placa:'RBV-4F96', grupo:'RODOTREM',    motorista:'João Batista'},
  {placa:'SDD-5J27', grupo:'RODOTREM',    motorista:'Leandro'},
  {placa:'SDD-5J67', grupo:'RODOTREM',    motorista:'Cleiton'},
  {placa:'SDD-6B47', grupo:'RODOTREM',    motorista:'Nelio'},
  {placa:'PRR-5H27', grupo:'4 EIXO',      motorista:'Ilson'},
  {placa:'PRU-6G14', grupo:'4 EIXO',      motorista:'Paulo'},
  {placa:'SDD-5J07', grupo:'RODOCAÇAMBA', motorista:'Samuel'},
  {placa:'SDD-6A77', grupo:'RODOCAÇAMBA', motorista:'Adenilson'},
  {placa:'MWL-8F67', grupo:'RODOCAÇAMBA', motorista:'Adailton'},
  {placa:'RCN-7I11', grupo:'FAZENDAS',    motorista:'Edmar'},
  {placa:'NKT-0H38', grupo:'FAZENDAS',    motorista:'Acleuto'},
  {placa:'RBP-1G55', grupo:'RODOTREM',    motorista:''},
];
const SITUACOES = ['AGUARDANDO CARREGAMENTO','VIAGEM PARA CARREGAMENTO','EM CARREGAMENTO','CARREGADO','VIAGEM PARA DESCARREGAMENTO','EM VIAGEM PARA DESCARREGAMENTO','EM DESCARREGAMENTO','DESCARREGANDO','DESCARREGADO','MANUTENÇÃO','SERVIÇOS - FAZENDA','PARADO','DISPONÍVEL'];

/* estado em memória: mapa placa -> campos */
let estado = {};
function novoRegistro(f){ return {placa:f.placa, grupo:f.grupo, produto:'', empresa:'', origem:'', destino:'', localizacao:'', situacao:'', motorista:f.motorista||'', obs:''}; }
function initEstado(){ estado={}; FROTA.forEach(f=> estado[f.placa]=novoRegistro(f)); }

/* ===================== RENDER DOS CARDS ===================== */
function render(){
  const cont=$('grupos'); cont.innerHTML='';
  const dl = `<datalist id="dl-sit">${SITUACOES.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
  cont.insertAdjacentHTML('beforeend', dl);
  // ordena por grupo (ordem fixa) e mantém ordem da FROTA
  GRUPOS.forEach(g=>{
    const placas = FROTA.filter(f=> (estado[f.placa].grupo||f.grupo)===g).map(f=>f.placa);
    if(!placas.length) return;
    const sec=document.createElement('div'); sec.className='grupo-sec';
    sec.innerHTML=`<div class="grupo-tit">${esc(g)}</div><div class="cards"></div>`;
    const cards=sec.querySelector('.cards');
    placas.forEach(placa=>{
      const r=estado[placa];
      const card=document.createElement('div'); card.className='tcard';
      card.innerHTML=`
        <div class="tcard-top">
          <span class="tcard-placa">${esc(placa)}</span>
          <span class="tcard-grp"><select onchange="setCampo('${placa}','grupo',this.value); render()">${GRUPOS.map(x=>`<option ${x===r.grupo?'selected':''}>${esc(x)}</option>`).join('')}</select></span>
        </div>
        <div class="tgrid">
          <div class="tf"><label>Produto / carga</label><input type="text" value="${esc(r.produto)}" oninput="setCampo('${placa}','produto',this.value)"></div>
          <div class="tf"><label>Empresa</label><input type="text" value="${esc(r.empresa)}" oninput="setCampo('${placa}','empresa',this.value)"></div>
          <div class="tf"><label>Origem</label><input type="text" value="${esc(r.origem)}" oninput="setCampo('${placa}','origem',this.value)"></div>
          <div class="tf"><label>Destino</label><input type="text" value="${esc(r.destino)}" oninput="setCampo('${placa}','destino',this.value)"></div>
          <div class="tf"><label>Localização</label><input type="text" value="${esc(r.localizacao)}" oninput="setCampo('${placa}','localizacao',this.value)"></div>
          <div class="tf"><label>Situação</label><input type="text" list="dl-sit" value="${esc(r.situacao)}" oninput="setCampo('${placa}','situacao',this.value)"></div>
          <div class="tf"><label>Motorista</label><input type="text" value="${esc(r.motorista)}" oninput="setCampo('${placa}','motorista',this.value)"></div>
          <div class="tf full"><label>Observação</label><input type="text" value="${esc(r.obs)}" oninput="setCampo('${placa}','obs',this.value)"></div>
        </div>`;
      cards.appendChild(card);
    });
    cont.appendChild(sec);
  });
}
function setCampo(placa,campo,val){ if(estado[placa]) estado[placa][campo]=val; }

/* ===================== CARGA / SALVAR ===================== */
async function carregarData(data){
  showLoading(true); setSync('sync');
  try{
    initEstado();
    const rows = await sb(`posicionamento?data=eq.${data}&order=id.asc`);
    rows.forEach(r=>{ if(estado[r.placa]){ estado[r.placa]={placa:r.placa, grupo:r.grupo||estado[r.placa].grupo, produto:r.produto||'', empresa:r.empresa||'', origem:r.origem||'', destino:r.destino||'', localizacao:r.localizacao||'', situacao:r.situacao||'', motorista:r.motorista||estado[r.placa].motorista||'', obs:r.obs||''}; } });
    render(); setSync('online');
    if(!rows.length) toast('Dia em branco. Use "Copiar do último dia" ou preencha.');
  }catch(e){ console.error(e); setSync('err'); toast('Erro ao carregar: '+e.message,true); }
  finally{ showLoading(false); }
}
function trocarData(){ carregarData($('f-data').value||hojeISO()); }

async function copiarDoUltimo(){
  const data=$('f-data').value||hojeISO();
  showLoading(true); setSync('sync');
  try{
    const ult = await sb(`posicionamento?select=data&data=lt.${data}&order=data.desc&limit=1`);
    if(!ult.length){ toast('Não há dia anterior salvo ainda.',true); return; }
    const d0=ult[0].data;
    const rows = await sb(`posicionamento?data=eq.${d0}&order=id.asc`);
    initEstado();
    rows.forEach(r=>{ if(estado[r.placa]){ estado[r.placa]={placa:r.placa, grupo:r.grupo||estado[r.placa].grupo, produto:r.produto||'', empresa:r.empresa||'', origem:r.origem||'', destino:r.destino||'', localizacao:r.localizacao||'', situacao:r.situacao||'', motorista:r.motorista||estado[r.placa].motorista||'', obs:r.obs||''}; } });
    render();
    toast('Copiado do dia '+fdateBR(d0)+'. Altere o que mudou e salve.');
  }catch(e){ toast('Erro: '+e.message,true); }
  finally{ showLoading(false); setSync('online'); }
}

async function salvar(){
  const data=$('f-data').value||hojeISO();
  if(!hasPerm('posicionamento') && currentRole!=='gestor' && !currentPerms['posicionamento']){ /* todos logados podem salvar */ }
  showLoading(true); setSync('sync');
  try{
    await sb(`posicionamento?data=eq.${data}`,{method:'DELETE',prefer:'return=minimal'});
    const rows = FROTA.map((f,i)=>{ const r=estado[f.placa]; return {data, placa:f.placa, grupo:r.grupo||f.grupo, produto:r.produto||null, empresa:r.empresa||null, origem:r.origem||null, destino:r.destino||null, localizacao:r.localizacao||null, situacao:r.situacao||null, motorista:r.motorista||null, obs:r.obs||null, ordem:i, lancador:currentNome}; });
    await sb('posicionamento',{method:'POST',body:JSON.stringify(rows),prefer:'return=minimal'});
    setSync('online'); toast('✓ Posicionamento de '+fdateBR(data)+' salvo.');
  }catch(e){ console.error(e); setSync('err'); toast('Erro ao salvar: '+e.message,true); }
  finally{ showLoading(false); }
}

/* ===================== RELATÓRIO (TEXTO) ===================== */
function linhasDe(r){
  const L=[];
  const temProduto = !!(r.produto && r.produto.trim());
  let head = r.placa + ' -> ';
  if(temProduto){ head += 'PRODUTO: ' + r.produto.trim() + (r.empresa && r.empresa.trim() ? ' ('+r.empresa.trim()+')' : ''); }
  else if(r.situacao && r.situacao.trim()){ head += r.situacao.trim(); }
  L.push(head.trimEnd());
  if((r.origem && r.origem.trim())||(r.destino && r.destino.trim())) L.push('* '+(r.origem||'').trim()+' X '+(r.destino||'').trim());
  if(r.localizacao && r.localizacao.trim()) L.push('* LOCALIZAÇÃO: '+r.localizacao.trim());
  if(temProduto && r.situacao && r.situacao.trim()) L.push('* '+r.situacao.trim());
  if(r.obs && r.obs.trim()) L.push('* '+r.obs.trim());
  if(r.motorista && r.motorista.trim()) L.push('* MOTORISTA: '+r.motorista.trim());
  return L.join('\n');
}
function regVazio(r){ return !((r.produto&&r.produto.trim())||(r.empresa&&r.empresa.trim())||(r.origem&&r.origem.trim())||(r.destino&&r.destino.trim())||(r.localizacao&&r.localizacao.trim())||(r.situacao&&r.situacao.trim())||(r.obs&&r.obs.trim())); }
function montarTexto(){
  const data=$('f-data').value||hojeISO();
  let out = 'POSICIONAMENTO FROTA – '+fdateBR(data)+'\n';
  GRUPOS.forEach(g=>{
    const placas = FROTA.filter(f=> (estado[f.placa].grupo||f.grupo)===g).map(f=>f.placa);
    if(!placas.length) return;
    const comDados = placas.filter(p=>!regVazio(estado[p]));
    if(!comDados.length) return;
    out += '\n'+g+':\n';
    comDados.forEach(p=>{ out += '\n'+linhasDe(estado[p])+'\n'; });
  });
  return out.trim();
}
async function copiarTexto(){
  const txt=montarTexto();
  try{ await navigator.clipboard.writeText(txt); toast('Relatório copiado. Cole no WhatsApp.'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Relatório copiado.');}catch(_){ toast('Copie manualmente.',true);} ta.remove(); }
}

/* ===================== RELATÓRIO (PDF COM GRADES) ===================== */
function gerarPDF(){
  const JS = window.jspdf && window.jspdf.jsPDF;
  if(!JS){ toast('Biblioteca do PDF não carregou (verifique a conexão).',true); return; }
  const data=$('f-data').value||hojeISO();
  const doc=new JS({orientation:'landscape',unit:'pt',format:'a4'});
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
  const L=40, R=PW-40, CX=PW/2, W=R-L, VERDE=[39,64,31];
  const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dp=(data||'').split('-');
  const dataExt = (dp.length===3)? (parseInt(dp[2],10)+' de '+MES[parseInt(dp[1],10)-1]+' de '+dp[0]) : fdateBR(data);
  try{ const img=document.querySelector('.logo img'); if(img && img.src) doc.addImage(img.src,'JPEG',L,22,34,34); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(39,64,31);
  doc.text('POSICIONAMENTO DA FROTA', CX, 42, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110,110,110);
  doc.text(dataExt, CX, 56, {align:'center'});
  doc.setDrawColor(39,64,31); doc.setLineWidth(1.2); doc.line(L,64,R,64);
  let y=76;
  const head=[['Placa','Produto / carga','Rota','Localização','Situação','Motorista','Observação']];
  GRUPOS.forEach(g=>{
    const placas = FROTA.filter(f=> (estado[f.placa].grupo||f.grupo)===g).map(f=>f.placa);
    if(!placas.length) return;
    const placasND = placas.filter(p=>!regVazio(estado[p]));
    if(!placasND.length) return;
    const body = placasND.map(p=>{ const r=estado[p];
      const carga = (r.produto||'') + (r.empresa? (r.produto?' ':'')+'('+r.empresa+')':'');
      const rota = (r.origem||r.destino)? ((r.origem||'')+' X '+(r.destino||'')) : '';
      return [r.placa, carga, rota, r.localizacao||'', r.situacao||'', r.motorista||'', r.obs||''];
    });
    if(y + 60 > PH-30){ doc.addPage(); y=50; }
    doc.setFillColor(39,64,31); doc.rect(L,y,W,15,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(g, CX, y+10.5, {align:'center'});
    y+=15;
    doc.autoTable({
      startY:y, head:head, body:body,
      styles:{fontSize:7, cellPadding:2.5, lineWidth:0.4, lineColor:[205,203,190], valign:'middle', overflow:'linebreak', textColor:[40,40,40]},
      headStyles:{fillColor:[233,235,228], textColor:[39,64,31], lineWidth:0.4, lineColor:[205,203,190], fontStyle:'bold'},
      alternateRowStyles:{fillColor:[246,246,240]},
      columnStyles:{0:{cellWidth:54,fontStyle:'bold'},1:{cellWidth:130},2:{cellWidth:196},3:{cellWidth:94},4:{cellWidth:116},5:{cellWidth:76},6:{cellWidth:'auto'}},
      margin:{left:L,right:40}
    });
    y = doc.lastAutoTable.finalY + 9;
  });
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
  doc.text('FOCO Logística  ·  Posicionamento da frota', CX, PH-20, {align:'center'});
  doc.save(`posicionamento_${data}.pdf`);
  toast('PDF gerado.');
}

/* ===================== INIT ===================== */
function initUI(){
  if(hasPerm('endividamento')) { const b=$('btn-endiv'); if(b) b.style.display=''; }
  if(hasPerm('configuracoes')) { const b=$('btn-config'); if(b) b.style.display=''; }
  if(!(currentRole!=='gestor' && currentPerms.receitas_bloqueado===true)){ const b=$('btn-receitas'); if(b) b.style.display=''; }
  $('userBadge').textContent = currentNome||'';
  $('f-data').value = hojeISO();
  initEstado(); render();
  carregarData(hojeISO());
}
initUI();
